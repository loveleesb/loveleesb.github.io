<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>스네이크 게임 · loveleesb 실습 02</title>
  <style>
    :root {
      --bg: #fffaf3; --surface: #ffffff; --text: #2b2420; --muted: #7a6e66;
      --primary: #ff6b4a; --primary-dark: #e4532f; --accent: #2bb3a3;
      --border: #f0e4d7; --board: #fdf3e7; --grid: #f6e6d4;
      --shadow: 0 8px 24px rgba(80, 50, 20, 0.08); --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1a1714; --surface: #26211d; --text: #f3ece6; --muted: #b3a79d;
        --primary: #ff825f; --primary-dark: #ff6b4a; --accent: #4fd1c1;
        --border: #3a322c; --board: #211c18; --grid: #2b2520;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
    }
    :root[data-theme="dark"] {
      --bg: #1a1714; --surface: #26211d; --text: #f3ece6; --muted: #b3a79d;
      --primary: #ff825f; --primary-dark: #ff6b4a; --accent: #4fd1c1;
      --border: #3a322c; --board: #211c18; --grid: #2b2520;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      min-height: 100vh; padding: 24px 16px 40px;
      -webkit-user-select: none; user-select: none;
    }
    button { font: inherit; color: inherit; }

    .wrap { max-width: 480px; margin: 0 auto; }
    .back { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.95rem; }
    .back:hover { color: var(--primary); }

    header { margin: 24px 0 16px; }
    header h1 { font-size: 1.9rem; }
    header p { color: var(--muted); }

    .scores { display: flex; gap: 10px; margin-bottom: 12px; }
    .score {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 8px 14px; box-shadow: var(--shadow);
    }
    .score span { display: block; font-size: 0.8rem; color: var(--muted); }
    .score strong { font-size: 1.4rem; font-variant-numeric: tabular-nums; }

    .board-wrap {
      position: relative; background: var(--board);
      border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden; aspect-ratio: 1;
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; }

    .overlay {
      position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
      background: color-mix(in srgb, var(--board) 82%, transparent);
      backdrop-filter: blur(2px); padding: 20px;
    }
    .overlay[hidden] { display: none; }
    .overlay h2 { font-size: 1.6rem; }
    .overlay p { color: var(--muted); margin: 4px 0 16px; }
    .btn {
      border: none; border-radius: 12px; padding: 10px 24px; cursor: pointer;
      background: var(--primary); color: #fff; font-weight: 700;
    }
    .btn:hover { background: var(--primary-dark); }

    .pad {
      display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px);
      gap: 8px; justify-content: center; margin-top: 16px;
    }
    .pad button {
      border: 1px solid var(--border); background: var(--surface); border-radius: 14px;
      font-size: 1.3rem; cursor: pointer; box-shadow: var(--shadow); touch-action: manipulation;
    }
    .pad button:active { background: var(--primary); color: #fff; }
    .pad .up { grid-column: 2; }
    .pad .left { grid-column: 1; grid-row: 2; }
    .pad .down { grid-column: 2; grid-row: 2; }
    .pad .right { grid-column: 3; grid-row: 2; }

    .help { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 14px; }
    kbd {
      font-family: inherit; font-size: 0.8rem; padding: 1px 6px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface);
    }
    @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../#projects">← 실습 목록</a>

    <header>
      <h1>🐍 스네이크 게임</h1>
      <p>Claude와 함께 만든 실습 02 · 사과를 먹고 길어지세요!</p>
    </header>

    <div class="scores">
      <div class="score"><span>점수</span><strong id="score">0</strong></div>
      <div class="score"><span>최고 점수</span><strong id="best">0</strong></div>
      <div class="score"><span>속도</span><strong id="level">1</strong></div>
    </div>

    <div class="board-wrap" id="board">
      <canvas id="canvas" width="480" height="480" aria-label="게임 화면"></canvas>
      <div class="overlay" id="overlay">
        <div>
          <h2 id="ovTitle">🐍 준비됐나요?</h2>
          <p id="ovText">방향키 또는 화면을 밀어서 움직여요</p>
          <button class="btn" id="startBtn">시작하기</button>
        </div>
      </div>
    </div>

    <div class="pad" aria-label="방향 버튼">
      <button class="up" data-dir="up" aria-label="위">▲</button>
      <button class="left" data-dir="left" aria-label="왼쪽">◀</button>
      <button class="down" data-dir="down" aria-label="아래">▼</button>
      <button class="right" data-dir="right" aria-label="오른쪽">▶</button>
    </div>

    <p class="help"><kbd>←↑↓→</kbd> / <kbd>WASD</kbd> 이동 · <kbd>Space</kbd> 일시정지 · 모바일은 스와이프</p>
  </div>

  <script>
    const N = 20;                 // 칸 수 (20 x 20)
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const CELL = canvas.width / N;
    const $ = (id) => document.getElementById(id);

    const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    const KEYS = {
      ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
      w: "up", s: "down", a: "left", d: "right",
      W: "up", S: "down", A: "left", D: "right",
    };

    const store = {
      get(k, f) { try { return JSON.parse(localStorage.getItem(k)) ?? f; } catch { return f; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    };

    try {
      const theme = store.get("theme", null);
      if (theme) document.documentElement.dataset.theme = theme;
    } catch {}

    let snake, dir, queue, food, score, best = store.get("snake-best", 0);
    let state = "ready";          // ready | playing | paused | over
    let timer = null;
    $("best").textContent = best;

    const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

    function reset() {
      snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
      dir = "right";
      queue = [];
      score = 0;
      placeFood();
      updateHud();
    }

    function placeFood() {
      const free = [];
      for (let y = 0; y < N; y++)
        for (let x = 0; x < N; x++)
          if (!snake.some((s) => s.x === x && s.y === y)) free.push({ x, y });
      food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
    }

    const level = () => Math.min(10, 1 + Math.floor(score / 5));
    const speed = () => Math.max(55, 150 - (level() - 1) * 10);   // ms per step

    function updateHud() {
      $("score").textContent = score;
      $("level").textContent = level();
    }

    function turn(next) {
      if (state === "ready" || state === "over") { start(); }
      if (state !== "playing") return;
      const last = queue.length ? queue[queue.length - 1] : dir;
      const [lx, ly] = DIRS[last], [nx, ny] = DIRS[next];
      if (lx + nx === 0 && ly + ny === 0) return;   // 정반대 방향 금지
      if (next === last) return;
      if (queue.length < 3) queue.push(next);
    }

    function step() {
      if (queue.length) dir = queue.shift();
      const [dx, dy] = DIRS[dir];
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      const eating = food && head.x === food.x && head.y === food.y;
      const body = eating ? snake : snake.slice(0, -1);
      const hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
      const hitSelf = body.some((s) => s.x === head.x && s.y === head.y);
      if (hitWall || hitSelf) return gameOver();

      snake.unshift(head);
      if (eating) {
        const prevLevel = level();
        score++;
        updateHud();
        placeFood();
        if (!food) return gameOver(true);
        if (level() !== prevLevel) restartTimer();
      } else {
        snake.pop();
      }
      draw();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function draw() {
      ctx.fillStyle = css("--board");
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = css("--grid");
      for (let y = 0; y < N; y++)
        for (let x = 0; x < N; x++)
          if ((x + y) % 2 === 0) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);

      if (food) {
        ctx.font = `${CELL * 0.85}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("🍎", food.x * CELL + CELL / 2, food.y * CELL + CELL / 2 + 1);
      }

      const head = css("--primary"), tail = css("--accent");
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? head : tail;
        ctx.globalAlpha = i === 0 ? 1 : Math.max(0.45, 1 - i / (snake.length + 6));
        roundRect(s.x * CELL + 1.5, s.y * CELL + 1.5, CELL - 3, CELL - 3, 7);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // 눈
      const h = snake[0], [dx, dy] = DIRS[dir];
      const cx = h.x * CELL + CELL / 2, cy = h.y * CELL + CELL / 2;
      const ox = dy !== 0 ? CELL * 0.2 : 0, oy = dx !== 0 ? CELL * 0.2 : 0;
      ctx.fillStyle = "#fff";
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(cx + ox * s + dx * CELL * 0.15, cy + oy * s + dy * CELL * 0.15, CELL * 0.11, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function restartTimer() {
      clearInterval(timer);
      timer = setInterval(step, speed());
    }

    function showOverlay(title, text, btn) {
      $("ovTitle").textContent = title;
      $("ovText").textContent = text;
      $("startBtn").textContent = btn;
      $("overlay").hidden = false;
    }

    function start() {
      reset();
      state = "playing";
      $("overlay").hidden = true;
      draw();
      restartTimer();
    }

    function togglePause() {
      if (state === "playing") {
        state = "paused";
        clearInterval(timer);
        showOverlay("⏸ 일시정지", `현재 점수 ${score}점`, "계속하기");
      } else if (state === "paused") {
        state = "playing";
        $("overlay").hidden = true;
        restartTimer();
      }
    }

    function gameOver(won = false) {
      clearInterval(timer);
      state = "over";
      draw();
      const newBest = score > best;
      if (newBest) { best = score; store.set("snake-best", best); $("best").textContent = best; }
      showOverlay(
        won ? "🏆 완벽해요!" : "💥 게임 오버",
        newBest ? `${score}점 · 새 최고 기록! 🎉` : `${score}점 · 최고 ${best}점`,
        "다시 하기"
      );
    }

    $("startBtn").addEventListener("click", () => (state === "paused" ? togglePause() : start()));

    document.addEventListener("keydown", (e) => {
      if (KEYS[e.key]) { e.preventDefault(); turn(KEYS[e.key]); }
      else if (e.key === " " || e.key === "p" || e.key === "P") {
        e.preventDefault();
        if (state === "ready" || state === "over") start(); else togglePause();
      }
    });

    document.querySelectorAll(".pad button").forEach((b) =>
      b.addEventListener("pointerdown", (e) => { e.preventDefault(); turn(b.dataset.dir); })
    );

    // 스와이프
    let touch = null;
    const board = $("board");
    board.addEventListener("pointerdown", (e) => { touch = { x: e.clientX, y: e.clientY }; });
    board.addEventListener("pointerup", (e) => {
      if (!touch || e.target.closest("button")) { touch = null; return; }
      const dx = e.clientX - touch.x, dy = e.clientY - touch.y;
      touch = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && state === "playing") togglePause();
    });

    reset();
    draw();
  </script>
</body>
</html>
