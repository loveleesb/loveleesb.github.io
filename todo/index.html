<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할일 목록 · loveleesb 실습 01</title>
  <style>
    :root {
      --bg: #fffaf3; --surface: #ffffff; --text: #2b2420; --muted: #7a6e66;
      --primary: #ff6b4a; --primary-dark: #e4532f; --accent: #2bb3a3;
      --border: #f0e4d7; --danger: #e5484d;
      --shadow: 0 8px 24px rgba(80, 50, 20, 0.08); --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1a1714; --surface: #26211d; --text: #f3ece6; --muted: #b3a79d;
        --primary: #ff825f; --primary-dark: #ff6b4a; --accent: #4fd1c1;
        --border: #3a322c; --danger: #ff6369; --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
    }
    :root[data-theme="dark"] {
      --bg: #1a1714; --surface: #26211d; --text: #f3ece6; --muted: #b3a79d;
      --primary: #ff825f; --primary-dark: #ff6b4a; --accent: #4fd1c1;
      --border: #3a322c; --danger: #ff6369; --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      min-height: 100vh; padding: 24px 16px 60px;
    }
    button, input { font: inherit; color: inherit; }
    a { color: inherit; }

    .wrap { max-width: 560px; margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .back { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.95rem; }
    .back:hover { color: var(--primary); }

    header h1 { font-size: 1.9rem; }
    header p { color: var(--muted); margin-top: 2px; }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      margin-top: 20px; overflow: hidden;
    }

    .add-form { display: flex; gap: 8px; padding: 14px; border-bottom: 1px solid var(--border); }
    .add-form input {
      flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--bg); outline: none;
    }
    .add-form input:focus { border-color: var(--primary); }
    .btn {
      border: none; border-radius: 12px; padding: 0 18px; cursor: pointer;
      background: var(--primary); color: #fff; font-weight: 700; white-space: nowrap;
    }
    .btn:hover { background: var(--primary-dark); }

    .progress { height: 4px; background: var(--border); }
    .progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }

    ul { list-style: none; }
    li {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; border-bottom: 1px solid var(--border);
      animation: in 0.2s ease;
    }
    @keyframes in { from { opacity: 0; transform: translateY(-4px); } }
    li:last-child { border-bottom: none; }
    li input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
    .text { flex: 1; min-width: 0; overflow-wrap: anywhere; cursor: text; }
    li.done .text { color: var(--muted); text-decoration: line-through; }
    .edit {
      flex: 1; min-width: 0; padding: 4px 8px; border-radius: 8px;
      border: 1px solid var(--primary); background: var(--bg); outline: none;
    }
    .del {
      border: none; background: none; cursor: pointer; color: var(--muted);
      width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; font-size: 1.1rem;
      opacity: 0.5; transition: opacity 0.15s, color 0.15s;
    }
    li:hover .del, .del:focus { opacity: 1; }
    .del:hover { color: var(--danger); }

    .empty { text-align: center; color: var(--muted); padding: 36px 14px; }

    .footer {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 14px; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--muted);
    }
    .filters { display: flex; gap: 4px; }
    .filters button, .link-btn {
      border: 1px solid transparent; background: none; cursor: pointer;
      padding: 4px 10px; border-radius: 999px; color: var(--muted);
    }
    .filters button.active { border-color: var(--primary); color: var(--primary); font-weight: 700; }
    .filters button:hover, .link-btn:hover { color: var(--primary); }
    .link-btn:disabled { opacity: 0.4; cursor: default; color: var(--muted); }

    .hint { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 16px; }

    @media (max-width: 480px) {
      .footer { justify-content: center; }
      .del { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="back" href="../#projects">← 실습 목록</a>
    </div>

    <header>
      <h1>📝 할일 목록</h1>
      <p id="summary">오늘 할 일을 적어보세요.</p>
    </header>

    <main class="card">
      <form class="add-form" id="addForm">
        <input id="newTodo" type="text" placeholder="할 일을 입력하고 Enter" maxlength="100" autocomplete="off" aria-label="새 할 일">
        <button class="btn" type="submit">추가</button>
      </form>
      <div class="progress" aria-hidden="true"><span id="bar"></span></div>

      <ul id="list"></ul>
      <p class="empty" id="empty" hidden></p>

      <div class="footer">
        <span id="count">0개 남음</span>
        <div class="filters" role="group" aria-label="필터">
          <button type="button" data-filter="all" class="active">전체</button>
          <button type="button" data-filter="active">진행 중</button>
          <button type="button" data-filter="done">완료</button>
        </div>
        <button type="button" class="link-btn" id="clearDone">완료 항목 삭제</button>
      </div>
    </main>

    <p class="hint">항목을 더블클릭하면 수정할 수 있어요 · 목록은 이 브라우저에 저장됩니다</p>
  </div>

  <script>
    const KEY = "loveleesb-todos";
    const $ = (s) => document.querySelector(s);

    const load = () => {
      try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
    };
    const save = () => {
      try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch { /* 저장 불가 시 무시 */ }
    };

    let todos = load();
    let filter = "all";

    function render() {
      const list = $("#list");
      list.innerHTML = "";

      const visible = todos.filter((t) =>
        filter === "all" ? true : filter === "done" ? t.done : !t.done
      );

      for (const t of visible) {
        const li = document.createElement("li");
        li.dataset.id = t.id;
        if (t.done) li.classList.add("done");

        const check = document.createElement("input");
        check.type = "checkbox";
        check.checked = t.done;
        check.setAttribute("aria-label", "완료 표시");

        const text = document.createElement("span");
        text.className = "text";
        text.textContent = t.text;
        text.title = "더블클릭하여 수정";

        const del = document.createElement("button");
        del.className = "del";
        del.type = "button";
        del.textContent = "✕";
        del.setAttribute("aria-label", "삭제");

        li.append(check, text, del);
        list.append(li);
      }

      const total = todos.length;
      const doneCount = todos.filter((t) => t.done).length;
      const left = total - doneCount;

      const empty = $("#empty");
      empty.hidden = visible.length > 0;
      empty.textContent =
        total === 0 ? "아직 할 일이 없어요. 하나 추가해 볼까요? 🌱"
        : filter === "done" ? "완료한 일이 아직 없어요."
        : filter === "active" ? "모두 끝냈어요! 🎉"
        : "";

      $("#count").textContent = `${left}개 남음`;
      $("#clearDone").disabled = doneCount === 0;
      $("#bar").style.width = total ? `${(doneCount / total) * 100}%` : "0";
      $("#summary").textContent =
        total === 0 ? "오늘 할 일을 적어보세요."
        : left === 0 ? `${total}개 모두 완료했어요! 🎉`
        : `${total}개 중 ${doneCount}개 완료`;

      document.querySelectorAll(".filters button").forEach((b) =>
        b.classList.toggle("active", b.dataset.filter === filter)
      );
    }

    function update() { save(); render(); }

    $("#addForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = $("#newTodo");
      const text = input.value.trim();
      if (!text) return;
      todos.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text, done: false });
      input.value = "";
      if (filter === "done") filter = "all";
      update();
    });

    const findTodo = (el) => todos.find((t) => t.id === el.closest("li")?.dataset.id);

    $("#list").addEventListener("change", (e) => {
      if (e.target.type !== "checkbox") return;
      const t = findTodo(e.target);
      if (t) { t.done = e.target.checked; update(); }
    });

    $("#list").addEventListener("click", (e) => {
      if (!e.target.classList.contains("del")) return;
      const t = findTodo(e.target);
      if (t) { todos = todos.filter((x) => x !== t); update(); }
    });

    $("#list").addEventListener("dblclick", (e) => {
      if (!e.target.classList.contains("text")) return;
      const t = findTodo(e.target);
      if (!t) return;

      const input = document.createElement("input");
      input.className = "edit";
      input.value = t.text;
      input.maxLength = 100;
      e.target.replaceWith(input);
      input.focus();
      input.select();

      let finished = false;
      const finish = (commit) => {
        if (finished) return;
        finished = true;
        const v = input.value.trim();
        if (commit && v) t.text = v;
        update();
      };
      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") finish(true);
        if (ev.key === "Escape") finish(false);
      });
      input.addEventListener("blur", () => finish(true));
    });

    document.querySelector(".filters").addEventListener("click", (e) => {
      const f = e.target.dataset.filter;
      if (f) { filter = f; render(); }
    });

    $("#clearDone").addEventListener("click", () => {
      todos = todos.filter((t) => !t.done);
      update();
    });

    // 메인 페이지에서 고른 테마(다크/라이트) 따라가기
    try {
      const theme = localStorage.getItem("theme");
      if (theme) document.documentElement.dataset.theme = JSON.parse(theme);
    } catch { /* 무시 */ }

    render();
  </script>
</body>
</html>
